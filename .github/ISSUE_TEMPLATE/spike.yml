name: 스파이크
description: 설계를 정하기 전에 가정 하나가 맞는지 짧게 확인한다
title: "Spike: "
labels: ["spike"]
body:
  - type: textarea
    id: assumption
    attributes:
      label: 확인할 가정
      description: 기획안 "검증할 가정" 목록에서 하나를 옮긴다.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: 성공 기준
      description: 무엇을 보면 가정이 맞다고 판단하나
    validations:
      required: true
  - type: textarea
    id: fallback
    attributes:
      label: 틀리면
      description: 가정이 틀렸을 때 바꿀 설계
  - type: textarea
    id: result
    attributes:
      label: 결과
      description: 끝나면 채운다. 로그를 붙일 땐 URL의 ? 뒤를 가린다 (학번 포함 가능).

[package]
name = "sorted-core"
description = "Sorted의 판정 로직과 확장↔앱 통신. 화면(Tauri)에 의존하지 않는다."
version.workspace = true
edition.workspace = true
license.workspace = true

# 의존성은 최소로 둔다. native-host가 이 크레이트에 의존하므로 다운로드마다 빨리 떠야 한다.
# (native-host가 쓰지 않는 모듈의 의존성은 링크 단계에서 빠진다.)
[dependencies]
sha2 = "0.11"
